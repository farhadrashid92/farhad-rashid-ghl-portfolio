kind = "web"
previewPath = "/"
title = "Farhad Rashid — GoHighLevel Specialist"
description = "A personal portfolio showcasing Farhad Rashid’s GoHighLevel funnels, workflows, CRM, and AI implementation work."
version = "1.0.0"
id = "artifacts/farhad-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24046

[services.development]
run = "pnpm --filter @workspace/farhad-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farhad-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/farhad-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24046"
BASE_PATH = "/"
